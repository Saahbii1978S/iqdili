plugins {
    id 'com.android.application'
}

android {
    namespace 'tn.ahlatounsa.app'
    compileSdk 36

    defaultConfig {
        applicationId 'tn.ahlatounsa.app'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('RELEASE_STORE_FILE') ?: 'missing-upload-key.jks')
            storePassword System.getenv('RELEASE_STORE_PASSWORD') ?: ''
            keyAlias System.getenv('RELEASE_KEY_ALIAS') ?: ''
            keyPassword System.getenv('RELEASE_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
