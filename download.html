<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>تطبيق أحلى توانسة</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f7f7f5;color:#171717;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,460px);background:#fff;border:1px solid #e9e9e7;border-radius:22px;padding:30px 22px;text-align:center;box-shadow:0 12px 36px #0000000a}
    .flag{font-size:38px}h1{font-size:28px;margin:12px 0 8px}p{line-height:1.9;color:#555;margin:10px 0 20px}
    a{display:block;text-decoration:none;background:#202a32;color:#fff;font-weight:800;font-size:18px;border-radius:14px;padding:15px 18px;margin:20px 0}
    small{display:block;color:#777;line-height:1.9;margin-top:10px}
    .status{padding:14px;border:1px solid #e7e5df;border-radius:14px;background:#fafaf8;color:#333;font-weight:700}
  </style>
</head>
<body>
  <main>
    <div class="flag">🇹🇳</div>
    <h1>أحلى توانسة</h1>
    <p>تطبيق أحلى توانسة للأندرويد</p>
    <div class="status">نسخة تجريبية للأندرويد</div>
    <a href="ahla-tounsa.apk" download="ahla-tounsa.apk">⬇️ حمّل التطبيق مباشرة</a>
    <small>هذه نسخة تجريبية غير منشورة على متجر Google Play. قد يعرض Android تحذيراً عند تثبيت التطبيقات من خارج المتجر.</small>
    <a href="https://ahla-tounsa-project.github.io/iqdili/">افتح منصة أحلى توانسة</a>
  </main>
</body>
</html>
