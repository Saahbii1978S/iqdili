name: Build and publish Ahla Tounsa Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK integrity, signature, and package
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='tn.ahlatounsa.app'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          echo "Verified APK size: $(stat -c%s "$APK") bytes"

      - name: Prepare direct-download APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/ahla-tounsa.apk

      - name: Keep workflow artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: ahla-tounsa-debug-apk
          path: dist/ahla-tounsa.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable direct-download release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: android-latest
          name: Ahla Tounsa Android APK
          target_commitish: main
          files: dist/ahla-tounsa.apk
          overwrite_files: true
          make_latest: true
          generate_release_notes: false
