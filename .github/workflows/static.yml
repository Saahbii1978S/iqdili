# Deploy the complete public web app and its required policy pages to GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Prepare public site
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p _site
          cp index.html curated-posts.json privacy.html terms.html delete-account.html download.html 404.html manifest.webmanifest service-worker.js app-icon.svg home-youthful-palette.css _site/
          # Keep obsolete database-connection wording out of every published HTML page.
          if grep -nF 'النشر السحابي يتطلب اتصالاً بقاعدة البيانات.' _site/*.html; then
            echo "Obsolete database-connection wording found in public HTML."
            exit 1
          fi
          if grep -nF 'اقضيلي' _site/*.html; then
            echo "Legacy Arabic project name found in public HTML."
            exit 1
          fi
          rsvg-convert -w 180 -h 180 app-icon.svg -o _site/app-icon-180.png
          rsvg-convert -w 192 -h 192 app-icon.svg -o _site/app-icon-192.png
          rsvg-convert -w 512 -h 512 app-icon.svg -o _site/app-icon-512.png
          test -s _site/app-icon-180.png
          test -s _site/app-icon-192.png
          test -s _site/app-icon-512.png
          grep -q 'app-icon-180.png' index.html
          grep -q 'app-icon-192.png' manifest.webmanifest
          grep -q 'app-icon-512.png' manifest.webmanifest
          python3 - <<'PY'
          import json
          import re
          import struct
          from pathlib import Path

          manifest = json.loads(Path("manifest.webmanifest").read_text(encoding="utf-8"))
          icons = manifest.get("icons", [])
          expected = {"192x192": "app-icon-192.png", "512x512": "app-icon-512.png"}
          for size, filename in expected.items():
              icon = next((item for item in icons if item.get("src", "").endswith(filename)), None)
              if not icon or icon.get("sizes") != size or icon.get("type") != "image/png":
                  raise SystemExit(f"Invalid manifest entry for {filename}")
              data = (Path("_site") / filename).read_bytes()
              if data[:8] != bytes([137, 80, 78, 71, 13, 10, 26, 10]):
                  raise SystemExit(f"Invalid PNG signature: {filename}")
              width, height = struct.unpack(">II", data[16:24])
              if (width, height) != tuple(map(int, size.split("x"))):
                  raise SystemExit(f"Incorrect dimensions for {filename}: {width}x{height}")

          html = Path("index.html").read_text(encoding="utf-8")
          match = re.search(r"""<link[^>]+rel=["']apple-touch-icon["'][^>]+href=["']([^"']+)""", html)
          if not match:
              raise SystemExit("Missing apple-touch-icon link")
          apple_icon = Path("_site") / Path(match.group(1)).name
          if not apple_icon.is_file() or apple_icon.stat().st_size == 0:
              raise SystemExit("Apple touch icon is missing from deployment")

          shell = Path("service-worker.js").read_text(encoding="utf-8")
          for filename in ("app-icon-180.png", "app-icon-192.png", "app-icon-512.png"):
              if filename not in shell or not (Path("_site") / filename).is_file():
                  raise SystemExit(f"Service worker icon missing: {filename}")

          # Every named offline-shell asset must both be cached and included in the Pages artifact.
          shell_files = (
              "app-icon.svg",
              "app-icon-180.png",
              "app-icon-192.png",
              "app-icon-512.png",
              "home-youthful-palette.css",
              "manifest.webmanifest",
              "privacy.html",
              "delete-account.html",
              "terms.html",
              "download.html",
              "404.html",
          )
          for filename in shell_files:
              escaped = re.escape(filename)
              cache_reference = re.search(
                  r"""APP_ROOT\s*\+\s*["']""" + escaped + r"""(?:\?[^"']*)?["']""",
                  shell,
              )
              if not cache_reference:
                  raise SystemExit(f"Service worker does not cache required shell asset: {filename}")
              if not (Path("_site") / filename).is_file():
                  raise SystemExit(f"Offline shell asset is absent from Pages artifact: {filename}")
          if "APP_ROOT, INDEX_URL" not in shell:
              raise SystemExit("Service worker home and index entries are missing.")
          print("Manifest, PNG dimensions, Apple icon and all offline-shell assets verified.")
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
