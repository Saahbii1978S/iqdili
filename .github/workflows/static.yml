# Deploy the complete public web app and its required policy pages to GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check all Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "::group::deno check $file"
            deno check "$file"
            echo "::endgroup::"
          done < <(find supabase/functions -mindepth 2 -maxdepth 2 -type f -name index.ts | sort)
      - name: Run all Edge Function tests
        run: deno test supabase/functions
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          mkdir -p _site
          cp index.html curated-posts.json privacy.html terms.html delete-account.html download.html 404.html manifest.webmanifest service-worker.js app-icon.svg home-youthful-palette.css _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
