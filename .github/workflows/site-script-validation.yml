name: Validate site scripts and analytics presence
on:
  push:
    branches:
      - integration/startup-analytics-retries-2026-11-21
    paths:
      - 'index.html'
      - 'tests/validate-site-inline-scripts.py'
      - '.github/workflows/site-script-validation.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'tests/validate-site-inline-scripts.py'
      - '.github/workflows/site-script-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate inline JavaScript and analytics lifecycle
        run: python3 tests/validate-site-inline-scripts.py
