name: Visitor heartbeat regression check

on:
  pull_request:
    branches: ["main"]
    paths:
      - "index.html"
      - ".github/workflows/visitor-heartbeat-check.yml"
      - "docs/operations/VISITOR-COUNTER-PR50-VALIDATION.md"

permissions:
  contents: read

jobs:
  heartbeat-invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check visitor heartbeat invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path("index.html").read_text(encoding="utf-8")
          start = source.find("function startSiteVisitTracking()")
          end = source.find("\nfunction connect()", start)
          assert start >= 0 and end > start, "Visitor tracking function was not found"
          fn = source[start:end]
          assert "sendHeartbeat();" in fn, "Initial heartbeat must run immediately"
          assert "window.setInterval(sendHeartbeat,120000)" in fn, "Expected a 120-second heartbeat interval"
          assert fn.index("if(isAdmin===true)return;") < fn.index('db.rpc("record_site_visit"'), "Admins must be excluded before recording a visit"
          assert 'db.rpc("record_site_visit",{p_visitor_id:visitorId})' in fn, "UUID visitor tracking RPC call is missing"
          helper_start = source.find("function getSiteVisitTrackingId()")
          helper_end = source.find("\nfunction startSiteVisitTracking()", helper_start)
          assert helper_start >= 0 and helper_end > helper_start, "Visitor ID helper was not found"
          helper = source[helper_start:helper_end]
          assert 'localStorage.getItem("ahla-visitor-id-v1")' in helper or 'localStorage.getItem(key)' in helper, "Persistent anonymous visitor ID is missing"
          assert "crypto.randomUUID()" in helper, "Random visitor UUID generation is missing"
          print("PASS: immediate heartbeat, 120-second interval, admin exclusion, anonymous UUID, and visit RPC are present.")
          PY
