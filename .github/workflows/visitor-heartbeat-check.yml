name: Visitor analytics regression check

on:
  push:
    branches: ["feat/privacy-first-visitor-analytics"]
  pull_request:
    branches: ["main"]
    paths:
      - "index.html"
      - "supabase/migrations/*privacy_first_visitor_analytics.sql"
      - ".github/workflows/visitor-heartbeat-check.yml"

permissions:
  contents: read

jobs:
  privacy-first-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check consent, tracking, and SQL privacy invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("index.html").read_text(encoding="utf-8")
          migration_path = Path("supabase/migrations/20261118230000_privacy_first_visitor_analytics.sql")
          sql = migration_path.read_text(encoding="utf-8")

          assert 'ahla-analytics-consent-v1' in source
          assert 'setupSiteVisitConsent();' in source
          assert 'function notifyRecentConfirmedSignup(session)' in source
          assert 'موافق' in source and 'لا، شكراً' in source
          assert 'نحبّوا نطوّروا أحلى توانسة ونحسّنوا خدماتنا. توافق تعاونّا؟' in source
          assert 'نستعملوا معرّفاً إحصائياً يساعدنا نربطوا الزيارات ببعضها.' in source
          assert 'تفاصيل الأقسام ومصادر الدخول تُحذف آلياً بعد 90 يوماً.' in source
          assert 'ahla-analytics-settings' not in source
          assert 'siteVisitConsentChoice!=="yes"' in source
          assert 'db.rpc("record_site_page_visit"' in source
          assert 'db.rpc("record_site_visit")' not in source
          assert 'function startSiteVisitTracking(){' in source
          assert 'db.rpc("get_site_visitor_details")' in source
          assert 'getSiteVisitTrackingId' not in source
          assert 'ahla-visitor-id-v1' not in source
          assert 'record_site_visit",{p_visitor_id:' not in source
          assert 'document.referrer' in source
          assert 'new URL(document.referrer)' in source
          assert 'searchParams' not in source[source.find('function recordSitePageVisit'):source.find('function startSiteVisitTracking')]
          assert '90 days' in sql
          assert 'cron.schedule' in sql
          assert 'revoke all on function public.record_site_visit(uuid)' in sql
          assert 'private.site_page_events' in sql
          assert 'extensions.digest' in sql
          assert 'insert into private.site_visitor_days' in sql
          assert 'p_page_key not in' in sql
          assert 'public.admins' in sql
          assert 'visitor_label text' in sql
          assert 'inet' in sql
          assert 'create table if not exists private.site_page_events' in sql
          assert 'grant execute on function public.get_site_visitor_details() to authenticated' in sql
          print("PASS: consent gate, decline path, section-only page tracking, hashed IP, admin-only visitor details, and 90-day event retention.")
          PY
