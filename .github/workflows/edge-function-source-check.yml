name: Edge Function source contract checks

on:
  pull_request:
    branches: ["main"]
    paths:
      - "supabase/functions/**"
      - "tests/edge-function-source-contracts.py"
      - ".github/workflows/edge-function-source-check.yml"

  push:
    branches: ["integration/main-based-storage-cleanup-2026-11-19"]
    paths:
      - "supabase/functions/**"
      - "tests/edge-function-source-contracts.py"
      - ".github/workflows/edge-function-source-check.yml"

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check integrated Edge Functions
        run: >-
          deno check supabase/functions/admin-approve-post/index.ts supabase/functions/admin-delete-post/index.ts
          supabase/functions/admin-update-post-status/index.ts supabase/functions/delete-account/index.ts
          supabase/functions/delete-my-post/index.ts supabase/functions/expire-posts/index.ts
          supabase/functions/notify-admin-new-user/index.ts supabase/functions/process-storage-cleanup/index.ts
          supabase/functions/submit-public-post/index.ts supabase/functions/ask-iqdili/index.ts
          supabase/functions/upload-pending-image/index.ts
      - name: Check Edge Function source contracts
        run: python3 tests/edge-function-source-contracts.py
