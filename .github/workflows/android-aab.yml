name: Build Ahla Tounsa Signed Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check signing secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Actions secret $name is missing."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the four signing secrets in Settings > Secrets and variables > Actions, then run this workflow again."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Prepare private upload key
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
          chmod 600 "$RUNNER_TEMP/upload-key.jks"
          keytool -list -keystore "$RUNNER_TEMP/upload-key.jks" -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/upload-key.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK and Play AAB
        working-directory: android
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Verify signed APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          unzip -t "$APK"
          unzip -t "$AAB"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='tn.ahlatounsa.app'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          keytool -printcert -jarfile "$APK"
          echo "Verified APK size: $(stat -c%s "$APK") bytes"
          echo "Verified AAB size: $(stat -c%s "$AAB") bytes"

      - name: Upload signed release files
        uses: actions/upload-artifact@v6
        with:
          name: ahla-tounsa-signed-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
