name: Safety regression tests

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  protected-demo-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check expiry function types
        run: deno check supabase/functions/expire-posts/index.ts
      - name: Run protected demo tests
        run: deno test supabase/functions/_shared/protected-demo_test.ts
