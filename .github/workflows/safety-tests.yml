name: Safety regression tests

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["integration/release-candidate-2026-11-15"]

permissions:
  contents: read

jobs:
  protected-demo-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check all Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "::group::deno check $file"
            deno check "$file"
            echo "::endgroup::"
          done < <(find supabase/functions -mindepth 2 -maxdepth 2 -type f -name index.ts | sort)
      - name: Run all Edge Function tests
        run: deno test supabase/functions

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply candidate migration and run PostgreSQL regression tests
        env:
          PGPASSWORD: postgres
        run: psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --file supabase/tests/storage-cleanup-queue.sql

      - name: Run isolated Storage policy regression tests
        env:
          PGPASSWORD: postgres
        run: psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --file supabase/tests/storage-policies.sql

      - name: Run synthetic public listing RPC security tests
        env:
          PGPASSWORD: postgres
        run: psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --file supabase/tests/public-listing-rpcs.sql
